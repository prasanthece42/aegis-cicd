[project]
name = "aegis-cicd"
version = "0.1.0"
description = "Phase 1 sample API and CI foundation for Aegis CI/CD"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
