[project]
name = "aegis-cicd"
version = "0.3.0"
description = "Sample API and browser UI for the Aegis CI/CD delivery lab"
requires-python = ">=3.12,<3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
