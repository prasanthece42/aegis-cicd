name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Serialize main releases; unique tags also prevent reruns replacing prior releases.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
    with:
      export-candidate: true
      platforms: '["amd64","arm64"]'

  publish:
    name: Publish and verify ${{ matrix.arch }} digest
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: read
      packages: write
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download this run's validated image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - name: Download dependency report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dependency-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports
      - name: Download image report and SBOM
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-reports-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports
      - name: Load candidate and verify its source identity
        run: |
          docker load --input candidate/image.tar
          python3 scripts/release_evidence.py check-candidate
          image="ghcr.io/${SOURCE_REPOSITORY,,}"
          tag="sha-${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}-${{ matrix.arch }}"
          echo "IMAGE_NAME=$image" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=$image:$tag" >> "$GITHUB_ENV"
          docker tag "aegis-sample:$SOURCE_SHA" "$image:$tag"
      - name: Authenticate using the short-lived workflow token
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push the validated image and resolve its registry digest
        run: |
          curl --fail --silent --show-error --location \
            "https://github.com/regclient/regclient/releases/download/v0.11.7/regctl-linux-${{ matrix.arch }}" \
            --output "$RUNNER_TEMP/regctl"
          if [[ '${{ matrix.arch }}' == amd64 ]]; then
            checksum=3737fbbdd791e04e7a831640b681f3397a376498e80e2ad9b1b2d27296f239bc
          else
            checksum=9f349bab5c407ac04f3dabf99c7c7a6b0f9e9723c23f2775380e804d02c6dbb9
          fi
          echo "$checksum  $RUNNER_TEMP/regctl" | sha256sum --check
          chmod +x "$RUNNER_TEMP/regctl"
          docker push "$IMAGE_TAG"
          docker buildx imagetools inspect "$IMAGE_TAG" --raw > reports/docker-manifest.json
          python3 scripts/oci_manifest.py < reports/docker-manifest.json > reports/published-oci-manifest.json
          "$RUNNER_TEMP/regctl" manifest put --content-type application/vnd.oci.image.manifest.v1+json \
            "$IMAGE_TAG" < reports/published-oci-manifest.json
          digest=$(docker buildx imagetools inspect "$IMAGE_TAG" --format '{{.Manifest.Digest}}')
          echo "PUBLISHED_DIGEST=$digest" >> "$GITHUB_ENV"
          docker pull "$IMAGE_NAME@$digest"
          docker image inspect "$IMAGE_NAME@$digest" > reports/pushed-image.json
          PUBLISHED_DIGEST="$digest" python3 scripts/release_evidence.py resolve-digest
      - name: Pull by digest and verify the exact runtime
        run: |
          reference=$(cat reports/image-reference.txt)
          docker pull "$reference"
          docker image inspect "$reference" > reports/pulled-image.json
          python3 scripts/release_evidence.py check-pulled
          bash scripts/verify-container.sh "$reference"
      - name: Record verified release evidence
        run: |
          python3 scripts/release_evidence.py write
          reference=$(cat reports/image-reference.txt)
          {
            echo '### Verified Phase 2 release'
            echo
            echo "Image: \`$reference\`"
            echo
            echo "Source commit: \`$SOURCE_SHA\`"
            echo
            echo 'Scans, SBOM, and unsigned release metadata are in the release-evidence artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain release evidence including partial failures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-evidence-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn

  release-index:
    name: Publish multi-platform release and delivery bundle
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_REPOSITORY: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_ATTEMPT: ${{ github.run_attempt }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-evidence-*-${{ github.run_id }}-${{ github.run_attempt }}
          path: platform-evidence
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Combine tested platform manifests without rebuilding
        run: |
          mkdir -p reports
          image="ghcr.io/${SOURCE_REPOSITORY,,}"
          tag="sha-${SOURCE_SHA}-${RUN_ID}-${RUN_ATTEMPT}"
          echo "IMAGE_TAG=$image:$tag" >> "$GITHUB_ENV"
          docker buildx imagetools create --tag "$image:$tag" \
            "$image:$tag-amd64" "$image:$tag-arm64"
          docker buildx imagetools inspect "$image:$tag" --format '{{json .Manifest}}' > reports/index.json
      - name: Export exact registry OCI content with preserved digests
        run: |
          reference=$(python3 -c 'import json,os; print(os.environ["IMAGE_TAG"].split(":")[0]+"@"+json.load(open("reports/index.json"))["digest"])')
          docker run --rm --user "$(id -u):$(id -g)" \
            --volume "${DOCKER_CONFIG:-$HOME/.docker}/config.json:/auth.json:ro" \
            --volume "$PWD/reports:/out" \
            quay.io/skopeo/stable:v1.21.0@sha256:a585e4a3b8a045baa87c7f1b2f940d6d299ebede85ab3f2419d52d2264eefc93 \
            copy --all --preserve-digests --authfile /auth.json \
            "docker://$reference" "oci-archive:/out/image.oci.tar:aegis-release"
      - name: Validate platform evidence and write release receipt
        run: python3 scripts/release_index.py
      - name: Publish versioned release assets
        run: |
          tag="release-${RUN_ID}-${RUN_ATTEMPT}"
          gh release create "$tag" --repo "$SOURCE_REPOSITORY" --target "$SOURCE_SHA" \
            --title "Validated release $SOURCE_SHA" --notes-file reports/release-notes.md \
            reports/release.json reports/image.oci.tar
          cat reports/release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: multi-platform-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/release.json
            reports/index.json
            reports/release-notes.md
          retention-days: 30
