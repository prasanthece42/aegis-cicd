name: CI

on:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      export-candidate:
        description: Export the validated image for a trusted release caller
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    name: Lint, tests, and dependency scan
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install locked development dependencies
        run: python -m pip install --require-hashes -r requirements.txt
      - name: Check shell syntax
        run: bash -n scripts/*.sh
      - name: Lint
        run: ruff check .
      - name: Check formatting
        run: ruff format --check .
      - name: Test
        run: python -m pytest
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: Scan dependency locks and enforce CRITICAL policy
        run: bash scripts/scan-security.sh dependencies
      - name: Retain dependency report even on scan failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/dependencies.json
          retention-days: 14
          if-no-files-found: warn

  container:
    name: Build, smoke-test, and scan container
    needs: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      IMAGE_TAG: aegis-sample:${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build commit-tagged image with source labels
        env:
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          docker build --tag "$IMAGE_TAG" \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$SOURCE_SHA" \
            --label "io.aegis.build.url=$RUN_URL" .
      - name: Verify candidate health and HTTP contract
        run: bash scripts/verify-container.sh "$IMAGE_TAG"
      - name: Export the exact candidate and image metadata
        run: |
          mkdir -p candidate reports
          docker save --output candidate/image.tar "$IMAGE_TAG"
          docker image inspect "$IMAGE_TAG" > candidate/image-inspect.json
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.76.1
          cache: true
      - name: Scan candidate archive, generate SBOM, and enforce CRITICAL policy
        run: bash scripts/scan-security.sh image candidate/image.tar
      - name: Retain image report and SBOM even on scan failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-reports-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/*.json
          retention-days: 14
          if-no-files-found: warn
      - name: Export validated candidate only for trusted main releases
        if: inputs.export-candidate && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
